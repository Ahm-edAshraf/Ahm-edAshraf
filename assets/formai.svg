.orbit{transform-origin:960px 232px;animation:spin 32s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.float{animation:float 8s ease-in-out infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.flow{stroke-dasharray:5 15;animation:flow 5s linear infinite}
.scan{animation:scan 9s ease-in-out infinite}
