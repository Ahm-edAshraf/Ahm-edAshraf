<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ahmed Ashraf — Full-stack development, AI automation, applied ML</title>
  <desc id="desc">A dark technical banner with cyan typography and a diagram connecting data, intelligence, and products.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#1E293B" stroke-opacity=".55"/></pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#164E63" stop-opacity=".55"/><stop offset="1" stop-color="#0B1120" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="#0B1120"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <ellipse cx="1060" cy="180" rx="360" ry="280" fill="url(#glow)"/>
  <path d="M32 1H1248" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="70" fill="#67E8F9" font-family="Consolas,monospace" font-size="15" letter-spacing="3">AHM-EDASHRAF / BUILDER</text>
    <text x="60" y="161" fill="#F8FAFC" font-size="72" font-weight="700" letter-spacing="-3">Ahmed Ashraf<tspan fill="#22D3EE">.</tspan></text>
    <text x="64" y="212" fill="#CBD5E1" font-size="25">From raw data to useful products.</text>
    <text x="64" y="258" fill="#94A3B8" font-size="18">Full-stack development · AI automation · Applied ML</text>
    <path d="M64 300H724" stroke="#263449"/>
    <circle cx="70" cy="337" r="5" fill="#22D3EE"/>
    <text x="88" y="343" fill="#94A3B8" font-family="Consolas,monospace" font-size="15">KUALA LUMPUR, MY  /  KAEC, SA</text>
  </g>
  <g font-family="Consolas,monospace" font-size="15">
    <path d="M1030 113V146M1030 212V245" stroke="#22D3EE" stroke-opacity=".6" stroke-width="2"/>
    <rect x="885" y="51" width="290" height="62" rx="10" fill="#101D30" stroke="#334155"/>
    <text x="907" y="89" fill="#64748B">01</text><text x="958" y="89" fill="#CBD5E1">DATA</text>
    <rect x="885" y="146" width="290" height="66" rx="10" fill="#10283A" stroke="#22D3EE" stroke-opacity=".65"/>
    <text x="907" y="186" fill="#67E8F9">02</text><text x="958" y="186" fill="#ECFEFF">INTELLIGENCE</text>
    <rect x="885" y="245" width="290" height="62" rx="10" fill="#101D30" stroke="#334155"/>
    <text x="907" y="283" fill="#818CF8">03</text><text x="958" y="283" fill="#CBD5E1">PRODUCT</text>
    <text x="905" y="352" fill="#64748B" font-size="13">BUILD / MEASURE / ITERATE</text>
  </g>
</svg>
