text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
.orbit{transform-origin:960px 232px;animation:spin 32s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.float{animation:float 8s ease-in-out infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.flow{stroke-dasharray:5 15;animation:flow 5s linear infinite}
.scan{animation:scan 9s ease-in-out infinite}
.blink{animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-100}}
@keyframes scan{0%,100%{transform:translateX(0);opacity:0}15%,85%{opacity:.6}50%{transform:translateX(900px)}}
@media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.flow,.scan,.blink{animation:none!important}}
